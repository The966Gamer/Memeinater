name: Build APK and EXE
on: workflow_dispatch

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check config
        shell: bash
        run: |
          if grep -q PASTE_PROJECT_URL_HERE www/config.js; then echo "Put your Supabase URL in www/config.js first"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: memeinater-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check config
        shell: bash
        run: |
          if grep -q PASTE_PROJECT_URL_HERE www/config.js; then echo "Put your Supabase URL in www/config.js first"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exe
        shell: bash
        run: |
          cd windows
          rm -rf www
          cp -r ../www www
          npm install
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: memeinater-exe
          path: windows/dist/*.exe
